# tools/check, on every push to main and every pull request. The same list
# the maintainer runs before a merge; a contributor sees it here before the
# maintainer does.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            hashseed: "0"
          - python: "3.x"
            hashseed: "1"
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - run: CHECK_BASE=origin/main tools/check
      - name: Device readiness report
        if: always()
        run: tools/add-device check --base origin/main --github --markdown --summary "$GITHUB_STEP_SUMMARY"
